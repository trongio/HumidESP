<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1240" height="900" fill="#ffffff"/>
  <style>
    .box{fill:#f6f8fa;stroke:#30363d;stroke-width:1.5}
    .t{font-weight:700;font-size:14px}
    .s{font-size:11px;fill:#57606a}
    .pin{font-size:12px}
    .w{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .v5{stroke:#d1242f}.gnd{stroke:#1f2328}.v3{stroke:#e36209}.sig{stroke:#1a7f37}.ab{stroke:#0969da}.bb{stroke:#8250df}.opt{stroke:#8c959f;stroke-dasharray:6 4}
    .dot{fill:#1f2328}
  </style>

  <text x="20" y="32" font-size="22" font-weight="700">HumidESP wiring</text>
  <text x="20" y="54" class="s">ESP32-WROOM-32 DevKit (30 pin) · 5 V 5 A PSU · relay switches the atomizer board · RS485 Modbus sensors for the cold room</text>

  <!-- Legend -->
  <g transform="translate(860,20)">
    <rect width="360" height="80" rx="8" class="box"/>
    <line x1="14" y1="20" x2="44" y2="20" class="w v5"/><text x="50" y="24">+5 V</text>
    <line x1="14" y1="42" x2="44" y2="42" class="w gnd"/><text x="50" y="46">GND (all grounds common)</text>
    <line x1="14" y1="64" x2="44" y2="64" class="w v3"/><text x="50" y="68">3.3 V from ESP32</text>
    <line x1="200" y1="20" x2="230" y2="20" class="w sig"/><text x="236" y="24">signal</text>
    <line x1="200" y1="42" x2="230" y2="42" class="w ab"/><text x="236" y="46">RS485 A / B</text>
    <line x1="200" y1="64" x2="230" y2="64" class="w bb"/><text x="236" y="68">sensor power (5 V, or 12 V)</text>
  </g>

  <!-- PSU -->
  <g transform="translate(20,90)">
    <rect width="190" height="150" rx="8" class="box"/>
    <text x="12" y="24" class="t">PSU 5 V 5 A</text>
    <text x="12" y="42" class="s">mains in: L, N, PE (earth)</text>
    <text x="12" y="56" class="s">insulate, keep outside the cold room</text>
    <text x="150" y="98" class="pin">V+</text><text x="150" y="128" class="pin">V−</text>
  </g>
  <!-- 5V / GND rails -->
  <line x1="190" y1="184" x2="300" y2="184" class="w v5"/>
  <line x1="190" y1="214" x2="280" y2="214" class="w gnd"/>
  <line x1="300" y1="184" x2="300" y2="840" class="w v5"/>
  <line x1="280" y1="214" x2="280" y2="860" class="w gnd"/>
  <line x1="300" y1="130" x2="300" y2="184" class="w v5"/>
  <line x1="300" y1="130" x2="760" y2="130" class="w v5"/>
  <line x1="280" y1="214" x2="280" y2="150" class="w gnd"/>
  <line x1="280" y1="150" x2="740" y2="150" class="w gnd"/>
  <text x="310" y="124" class="s">5 V rail (≥ 1 mm² / 18 AWG for atomizer current)</text>

  <!-- ESP32 -->
  <g transform="translate(380,250)">
    <rect width="230" height="390" rx="10" fill="#24292f"/>
    <rect x="70" y="14" width="90" height="70" rx="4" fill="#57606a"/>
    <text x="115" y="54" fill="#fff" text-anchor="middle" font-size="11">ESP-WROOM-32</text>
    <text x="115" y="370" fill="#fff" text-anchor="middle" font-size="12">ESP32 DevKit · USB-C (CH340)</text>
    <g fill="#fff" class="pin">
      <text x="10" y="120">VIN (5 V in)</text>
      <text x="10" y="150">GND</text>
      <text x="10" y="180">3V3 (out)</text>
      <text x="10" y="230">GPIO4 · DHT (test)</text>
      <text x="10" y="260">GPIO21 SDA · 22 SCL</text>
      <text x="10" y="310">GPIO33 · float sw.</text>
      <text x="10" y="340">GPIO25 · buzzer</text>
      <text x="220" y="120" text-anchor="end">GPIO26 · relay 1</text>
      <text x="220" y="150" text-anchor="end">GPIO27 · relay 2</text>
      <text x="220" y="200" text-anchor="end">GPIO32 · button H1</text>
      <text x="220" y="230" text-anchor="end">GPIO13 · button H2</text>
      <text x="220" y="280" text-anchor="end">GPIO17 TX2</text>
      <text x="220" y="310" text-anchor="end">GPIO16 RX2</text>
      <text x="220" y="340" text-anchor="end">GPIO18 DE/RE</text>
    </g>
  </g>
  <!-- ESP power -->
  <line x1="300" y1="366" x2="380" y2="366" class="w v5"/><circle cx="300" cy="366" r="4" class="dot" fill="#d1242f"/>
  <line x1="280" y1="396" x2="380" y2="396" class="w gnd"/><circle cx="280" cy="396" r="4" class="dot"/>

  <!-- Relay module -->
  <g transform="translate(700,170)">
    <rect width="200" height="170" rx="8" class="box" fill="#ffe8e8"/>
    <text x="12" y="24" class="t">Relay module 5 V</text>
    <text x="12" y="40" class="s">jumper on H (high-level trigger)</text>
    <text x="12" y="70" class="pin">DC+</text><text x="12" y="96" class="pin">DC−</text>
    <text x="12" y="122" class="pin">IN1</text><text x="12" y="148" class="pin">IN2</text>
    <text x="188" y="70" class="pin" text-anchor="end">COM1</text><text x="188" y="96" class="pin" text-anchor="end">NO1</text>
    <text x="188" y="122" class="pin" text-anchor="end">COM2</text><text x="188" y="148" class="pin" text-anchor="end">NO2</text>
  </g>
  <polyline points="760,130 760,180 690,180 690,236 700,236" class="w v5"/>
  <polyline points="740,150 740,160 680,160 680,262 700,262" class="w gnd"/>
  <polyline points="610,370 650,370 650,288 700,288" class="w sig"/>
  <polyline points="610,400 664,400 664,314 700,314" class="w sig"/>
  <!-- COM from 5V -->
  <polyline points="760,130 940,130 940,236 900,236" class="w v5"/>
  <polyline points="940,236 940,288 900,288" class="w v5"/>

  <!-- Atomizer board -->
  <g transform="translate(990,170)">
    <rect width="230" height="200" rx="8" class="box" fill="#e8f0ff"/>
    <text x="12" y="24" class="t">Atomizer board JY-M22A0</text>
    <text x="12" y="40" class="s">use the "DC 5V + / −" pads on the back</text>
    <text x="12" y="70" class="pin">DC 5V +</text><text x="12" y="96" class="pin">DC 5V −</text>
    <text x="12" y="130" class="s">J1–J4: 4 atomizer discs</text>
    <text x="12" y="146" class="s">never power it without discs</text>
    <text x="12" y="170" class="pin">S1 / S2 buttons</text>
    <text x="12" y="186" class="s">(only if it starts idle, see PC817)</text>
  </g>
  <polyline points="900,262 990,262" class="w v5"/>
  <text x="915" y="256" class="s">NO1</text>
  <polyline points="280,150 280,150 970,150 970,288 990,288" class="w gnd"/>
  <text x="1000" y="400" class="s">Board 2 (optional) on NO2</text>
  <polyline points="900,314 925,314 925,410 990,410" class="w v5 opt"/>

  <!-- PC817 option -->
  <g transform="translate(700,420)">
    <rect width="260" height="120" rx="8" class="box" stroke-dasharray="6 4"/>
    <text x="12" y="22" class="t">Optional: PC817 "button press"</text>
    <text x="12" y="42" class="s">GPIO32 → 330 Ω → PC817 pin 1 (anode)</text>
    <text x="12" y="58" class="s">PC817 pin 2 (cathode) → GND</text>
    <text x="12" y="74" class="s">pin 4 (collector) / pin 3 (emitter) across S1 pads</text>
    <text x="12" y="90" class="s">(collector to the pad that measures + vs GND)</text>
    <text x="12" y="108" class="s">Set "presses after power on" in the web UI</text>
  </g>
  <polyline points="610,450 700,470" class="w sig opt"/>

  <!-- RS485 module -->
  <g transform="translate(380,690)">
    <rect width="230" height="170" rx="8" class="box" fill="#eaf5ea"/>
    <text x="12" y="24" class="t">TTL ↔ RS485 module</text>
    <text x="12" y="40" class="s">3.3 V type, auto direction (or MAX3485)</text>
    <text x="12" y="70" class="pin">VCC</text><text x="12" y="96" class="pin">GND</text>
    <text x="12" y="122" class="pin">TXD / DI</text><text x="12" y="148" class="pin">RXD / RO</text>
    <text x="218" y="70" class="pin" text-anchor="end">A+</text><text x="218" y="96" class="pin" text-anchor="end">B−</text>
    <text x="218" y="148" class="pin" text-anchor="end">DE+RE*</text>
  </g>
  <polyline points="380,430 340,430 340,756 380,756" class="w v3"/>
  <polyline points="280,782 380,782" class="w gnd"/><circle cx="280" cy="782" r="4" class="dot"/>
  <polyline points="610,530 640,530 640,660 360,660 360,808 380,808" class="w sig"/>
  <polyline points="610,560 630,560 630,650 350,650 350,834 380,834" class="w sig"/>
  <polyline points="610,590 660,590 660,834 610,834" class="w sig opt"/>
  <text x="390" y="890" class="s">* DE/RE only on modules without auto direction. If the bus scan finds nothing, swap TX/RX.</text>

  <!-- Boost converter -->
  <g transform="translate(20,690)">
    <rect width="230" height="130" rx="8" class="box" fill="#f3eaff"/>
    <text x="12" y="24" class="t">Boost MT3608 / XL6009</text>
    <text x="12" y="40" class="s">not needed for XY-MD03 (5–28 V)</text>
    <text x="12" y="58" class="s">only for Renke 10–30 V; set 12 V first</text>
    <text x="12" y="90" class="pin">IN+ ← 5 V</text><text x="12" y="114" class="pin">IN− ← GND</text>
    <text x="218" y="90" class="pin" text-anchor="end">OUT+</text><text x="218" y="114" class="pin" text-anchor="end">OUT−</text>
  </g>
  <polyline points="250,776 300,776" class="w v5"/>
  <polyline points="250,800 280,800" class="w gnd"/>

  <!-- RS485 bus to sensors -->
  <g>
    <text x="700" y="610" class="t">Cold room: RS485 sensors, daisy chained</text>
    <text x="700" y="628" class="s">twisted pair (CAT5: A = one pair, B = its partner, GND + power on another pair)</text>
    <polyline points="610,756 1200,756" class="w ab"/>
    <polyline points="610,782 1200,782" class="w ab" stroke-dasharray="1 0"/>
    <text x="1160" y="750" class="s">A</text><text x="1160" y="798" class="s">B</text>
    <polyline points="230,830 230,870 1200,870" class="w bb"/>
    <text x="700" y="864" class="s">sensor power: 5 V rail for XY-MD03 (or 12 V from boost for Renke), plus GND</text>
    <polyline points="280,860 680,860 680,848 1200,848" class="w gnd"/>
    <g font-size="12">
      <rect x="720" y="650" width="130" height="80" rx="8" class="box"/><text x="732" y="672" class="t">Sensor #1</text><text x="732" y="690" class="s">low, near door</text><text x="732" y="718" class="s">V+ GND A B</text>
      <rect x="880" y="650" width="130" height="80" rx="8" class="box"/><text x="892" y="672" class="t">Sensor #2</text><text x="892" y="690" class="s">centre, 1.5 m</text><text x="892" y="718" class="s">V+ GND A B</text>
      <rect x="1040" y="650" width="130" height="80" rx="8" class="box"/><text x="1052" y="672" class="t">Sensor #3</text><text x="1052" y="690" class="s">high, far corner</text><text x="1052" y="718" class="s">V+ GND A B</text>
    </g>
    <g class="w ab"><line x1="760" y1="730" x2="760" y2="756"/><line x1="920" y1="730" x2="920" y2="756"/><line x1="1080" y1="730" x2="1080" y2="756"/></g>
    <g class="w ab"><line x1="790" y1="730" x2="790" y2="782"/><line x1="950" y1="730" x2="950" y2="782"/><line x1="1110" y1="730" x2="1110" y2="782"/></g>
    <g class="w gnd"><line x1="820" y1="730" x2="820" y2="848"/><line x1="980" y1="730" x2="980" y2="848"/><line x1="1140" y1="730" x2="1140" y2="848"/></g>
    <g class="w bb"><line x1="735" y1="730" x2="735" y2="870"/><line x1="895" y1="730" x2="895" y2="870"/><line x1="1055" y1="730" x2="1055" y2="870"/></g>
    <rect x="1190" y="760" width="20" height="18" fill="#fff" stroke="#30363d"/><text x="1186" y="814" class="s" text-anchor="end">120 Ω across A–B at the far end</text>
  </g>

  <!-- Optional extras -->
  <g transform="translate(20,270)">
    <rect width="250" height="370" rx="8" class="box" stroke-dasharray="6 4" fill="#fff"/>
    <text x="12" y="22" class="t">Other connections</text>
    <text x="12" y="46" class="pin">DHT11 module (desk test only)</text>
    <text x="12" y="62" class="s">S → GPIO4, + → 3V3, − → GND</text>
    <text x="12" y="90" class="pin">SHT4x / SHT3x breakout (I2C)</text>
    <text x="12" y="106" class="s">VIN → 3V3, GND, SDA → 21, SCL → 22</text>
    <text x="12" y="122" class="s">max ~1–2 m cable; addr 0x44 or 0x45</text>
    <text x="12" y="150" class="pin">Float switch (optional)</text>
    <text x="12" y="166" class="s">GPIO33 ↔ switch ↔ GND (internal pull-up)</text>
    <text x="12" y="194" class="pin">Active buzzer module (optional)</text>
    <text x="12" y="210" class="s">I/O → GPIO25, VCC → 3V3 or 5V, GND (low-trigger: see config.h)</text>
    <text x="12" y="238" class="pin">Do not use for outputs:</text>
    <text x="12" y="254" class="s">GPIO 0, 2, 5, 12, 15 (boot straps)</text>
    <text x="12" y="270" class="s">GPIO 34–39 are input only</text>
    <text x="12" y="298" class="pin">Flashing</text>
    <text x="12" y="314" class="s">Unplug the PSU 5 V from VIN while the</text>
    <text x="12" y="330" class="s">USB cable is connected, or use the</text>
    <text x="12" y="346" class="s">web firmware update instead.</text>
  </g>
</svg>
