<text x="60" y="180" font-size="17" font-weight="normal" fill="#57606a" text-anchor="start" >Pin order differs between modules. Follow the</text>
<text x="60" y="204" font-size="17" font-weight="normal" fill="#57606a" text-anchor="start" >letters printed on yours: S can be DAT or OUT,</text>
<text x="60" y="228" font-size="17" font-weight="normal" fill="#57606a" text-anchor="start" >+ can be VCC, - can be GND.</text>
<path d="M 872 595 H 940" stroke="#4b5563" stroke-width="12" stroke-linecap="round" fill="none"/>
<text x="930" y="639" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle" >USB cable to</text>
<text x="930" y="661" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle" >your computer</text>
<text x="930" y="683" font-size="15" font-weight="normal" fill="#57606a" text-anchor="middle" >(power + upload)</text>
<rect x="60" y="760" width="880" height="70" rx="10" fill="#fff8e1" stroke="#e0b100" stroke-width="2" />
<text x="80" y="790" font-size="17" font-weight="bold" fill="#1b1b1b" text-anchor="start" >Desk test only.</text>
<text x="80" y="815" font-size="16" font-weight="normal" fill="#1b1b1b" text-anchor="start" >The DHT11 does not survive a cold room (rated 0-50 °C, 20-90 %RH). Step 3 adds the real sensors.</text>
<rect x="1000" y="120" width="410" height="710" rx="14" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" />
<text x="1024" y="162" font-size="24" font-weight="bold" fill="#1b1b1b" text-anchor="start" >Steps</text>
<circle cx="1040" cy="196" r="16" fill="#57606a"/>
<text x="1040" y="202" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" >1</text>
<text x="1066" y="202" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >Unplug the USB cable while you wire.</text>
<circle cx="1040" cy="235" r="16" fill="#2b9348"/>
<text x="1040" y="241" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" >2</text>
<text x="1066" y="241" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >DHT11 S (DAT) to D4. D4 is GPIO4.</text>
<circle cx="1040" cy="274" r="16" fill="#f08c00"/>
<text x="1040" y="280" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" >3</text>
<text x="1066" y="280" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >DHT11 + (VCC) to 3V3.</text>
<circle cx="1040" cy="313" r="16" fill="#1b1b1b"/>
<text x="1040" y="319" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" >4</text>
<text x="1066" y="319" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >DHT11 - (GND) to GND, the pin right</text>
<text x="1066" y="342" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >next to 3V3.</text>
<circle cx="1040" cy="375" r="16" fill="#57606a"/>
<text x="1040" y="381" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" >5</text>
<text x="1066" y="381" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >Plug in USB and flash the firmware:</text>
<text x="1066" y="404" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >pio run -t upload</text>
<circle cx="1040" cy="437" r="16" fill="#57606a"/>
<text x="1040" y="443" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" >6</text>
<text x="1066" y="443" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >Join the Wi-Fi HumidESP (password</text>
<text x="1066" y="466" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >humidesp123) and open 192.168.4.1.</text>
<text x="1066" y="489" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >"Desk DHT11" shows a reading after a</text>
<text x="1066" y="512" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >few seconds.</text>
<line x1="1024" y1="557" x2="1386" y2="557" stroke="#d0d7de" stroke-width="2"/>
<text x="1024" y="593" font-size="20" font-weight="bold" fill="#1b1b1b" text-anchor="start" >Wire colours</text>
<line x1="1024" y1="619" x2="1070" y2="619" stroke="#d62828" stroke-width="7" stroke-linecap="round" />
<text x="1084" y="625" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >5 V</text>
<line x1="1024" y1="649" x2="1070" y2="649" stroke="#1b1b1b" stroke-width="7" stroke-linecap="round" />
<text x="1084" y="655" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >GND (ground)</text>
<line x1="1024" y1="679" x2="1070" y2="679" stroke="#f08c00" stroke-width="7" stroke-linecap="round" />
<text x="1084" y="685" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="start" >3.3 V</text>
